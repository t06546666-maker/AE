name: Merchant daily reminders
on:
  schedule:
    # 09:00, 13:00, 18:00 IST; two backup triggers share the same delivery locks.
    - cron: '30,40,50 3,7,12 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: merchant-daily-reminders
  cancel-in-progress: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Send scheduled reminders or validate without sending
        env:
          REMINDER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node scripts/run-merchant-reminders.cjs
